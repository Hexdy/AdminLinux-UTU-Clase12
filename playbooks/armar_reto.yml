---
# armar_reto.yml — Desplegá tu estación para auditar el servidor que te dejaron.
# MULTI-DISTRO: Debian/Ubuntu (apt) · Arch (pacman) · Fedora/RHEL (dnf).
#
# ESCENARIO (no es hacking, es laburo de sysadmin junior): te dan de alta en un
# equipo, el compañero que se fue dejó una app con su log y una carpeta de scripts
# viejos, y te piden un informe. Este playbook, en un solo paso:
#   1) Comprueba que tu distro esté soportada.
#   2) Instala shellcheck y gawk con el módulo genérico 'package' (apt, pacman o
#      dnf según tu distro), envuelto en block/rescue: si no hay sudo o no hay red,
#      avisa y sigue (el reto se resuelve igual con grep, que ya tenés).
#   3) Crea el área de trabajo  datos/reto/          (módulo file).
#   4) Copia el material: el log de la app y los scripts viejos  (módulo copy).
#   5) Genera una MISION.txt personalizada con TUS datos  (módulo template + facts).
#   6) Deja la nota del equipo con permisos 0600 = solo su dueño  (security by design).
#   7) Te recuerda la plantilla de script y dónde está shellcheck.
#
# La gracia de Ansible: el MISMO playbook arma el laboratorio en Ubuntu, Arch o
# Fedora sin que cambies una línea. Y es IDEMPOTENTE: corrélo mil veces, siempre
# deja el entorno igual (2ª corrida = changed=0).
#
# Con una sola VM alcanza: corre todo contra localhost (grupo [local]).
#
# ¿No tenés Ansible? Corré primero:   bash comprobar_requisitos.sh
#
# Simular sin aplicar (RECOMENDADO la 1ª vez):
#   ansible-playbook armar_reto.yml -l local --check --diff
# Aplicar de verdad:
#   ansible-playbook armar_reto.yml -l local
#   (si al instalar los paquetes te pide contraseña de sudo, agregá  -K)

- name: Armar la estación de auditoría (Debian/Ubuntu + Arch + Fedora)
  hosts: local
  become: false

  vars:
    # true = instala shellcheck y gawk (necesita sudo; agregá -K si te pide clave).
    # Poné false si no querés usar sudo: el reto se resuelve igual.
    instalar_herramientas: true
    area: "{{ playbook_dir }}/../datos/reto"
    # El MISMO programa, distinto nombre de paquete según la familia.
    # En Fedora/RHEL el paquete se llama 'ShellCheck', con mayúsculas.
    pkg_shellcheck: "{{ 'ShellCheck' if ansible_os_family == 'RedHat' else 'shellcheck' }}"
    gestor: >-
      {{ 'apt' if ansible_os_family == 'Debian'
         else ('pacman' if ansible_os_family == 'Archlinux' else 'dnf') }}

  pre_tasks:
    # Si tu distro no es de estas 3 familias, el playbook se detiene ACÁ y te lo
    # explica (en vez de romper a la mitad).
    - name: Comprobar que la distribución está soportada
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'Archlinux', 'RedHat']
        fail_msg: >-
          Distro no soportada: {{ ansible_distribution }}
          (familia {{ ansible_os_family }}). Este material corre en Debian/Ubuntu
          (gestor apt), Arch (gestor pacman) y Fedora/RHEL (gestor dnf). Bash es
          el mismo en las tres: solo cambia cómo se instala un paquete.
        success_msg: >-
          Distro soportada: {{ ansible_distribution }} ({{ ansible_os_family }}).
        quiet: true

    # UN solo módulo, TRES gestores: 'package' elige apt / pacman / dnf por vos.
    # block/rescue: si falla (sin sudo, sin red, repos rotos) NO te tira el
    # laboratorio abajo — te avisa y seguís.
    - name: Instalar las herramientas de forma tolerante a fallos
      when: instalar_herramientas | bool
      block:
        - name: Instalar shellcheck y gawk (el mismo módulo usa apt, pacman o dnf)
          ansible.builtin.package:
            name:
              - "{{ pkg_shellcheck }}"
              - gawk
            state: present
          become: true
      rescue:
        - name: Avisar que no se pudo instalar (y seguir igual)
          ansible.builtin.debug:
            msg: >-
              No pude instalar las herramientas ({{ ansible_os_family }}, gestor
              {{ gestor }}). Seguimos igual: el reto se resuelve con grep y las
              pruebas de archivo de Bash, que ya vienen en cualquier distro.
              Si querés shellcheck, instalalo a mano y volvé a correr el playbook.

  tasks:
    - name: Crear el área de trabajo de la auditoría
      ansible.builtin.file:
        path: "{{ area }}"
        state: directory
        mode: '0755'

    - name: Copiar el log de la app que te dejaron
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/app_reto.log"
        dest: "{{ area }}/app_reto.log"
        mode: '0644'

    - name: Copiar la carpeta de scripts viejos del compañero que se fue
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/scripts_reto/"
        dest: "{{ area }}/scripts_reto/"
        mode: '0644'

    - name: Dejar una copia de la plantilla de script al alcance de la mano
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docs/plantilla_script.sh"
        dest: "{{ area }}/plantilla_script.sh"
        mode: '0755'

    - name: Generar TU misión personalizada (módulo template + facts)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/mision.txt.j2"
        dest: "{{ area }}/MISION.txt"
        mode: '0644'

    - name: Dejar la nota del equipo y asegurarla (0600 = solo su dueño)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/nota_equipo.txt"
        dest: "{{ area }}/nota_equipo.txt"
        mode: '0600'

  post_tasks:
    # "Verificar antes de confiar": mostramos cuánto material quedó listo.
    # changed_when: false -> es una consulta, no cambia nada: así sigue siendo idempotente.
    - name: Contar las líneas del log del incidente
      ansible.builtin.command:
        cmd: "wc -l {{ area }}/app_reto.log"
      changed_when: false
      register: conteo

    - name: Ver si shellcheck quedó disponible EN TU DISTRO
      ansible.builtin.command:
        cmd: "shellcheck --version"
      changed_when: false
      failed_when: false
      register: sc_estado

    - name: Mostrar la misión
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - "  Estación lista en:  datos/reto/     (abrí MISION.txt)"
          - "  {{ conteo.stdout | trim }}"
          - "  shellcheck: {{ 'instalado' if sc_estado.rc == 0 else 'NO disponible (instalalo con ' + gestor + ')' }}"
          - "---------------------------------------------------------------"
          - "  Escribí TU script auditar.sh (partí de plantilla_script.sh) y"
          - "  armá la bandera con este formato EXACTO:"
          - "      BANDERA{<R1>-<R2>-<R3>}"
          - ""
          - "  R1) ¿Cuántas líneas son de NIVEL ERROR? (ojo: grep -c ERROR miente)"
          - "  R2) ¿Qué SERVICIO acumula más líneas de nivel ERROR?"
          - "  R3) ¿Cuántos .sh de scripts_reto/ NO tienen shebang en la línea 1?"
          - ""
          - "  Verificá tu bandera con Ansible (el repo NO la guarda en texto"
          - "  plano, solo su huella SHA-256):"
          - "     ansible-playbook comprobar_bandera.yml -e \"bandera=BANDERA{...}\""
          - "==============================================================="
